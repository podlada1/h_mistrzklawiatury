name: Check keyboard game

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Use Ubuntu's Python and matching Tkinter package together.
      - uses: actions/checkout@v4
      - name: Install Python and Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk
      - name: Check Python syntax
        run: python3 -m compileall -q mistrz_klawiatury.py
      - name: Check imports without opening a window
        run: python3 -c "import mistrz_klawiatury"
